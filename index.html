<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#EEF0F3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="電卓">
  <title>電卓</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="hist-head">
      <h1>計算履歴</h1>
      <button id="clearAll" class="clear-all">すべて削除</button>
    </header>
    <section id="history" class="history" aria-label="計算履歴"></section>
    <section class="display" aria-live="polite">
      <button id="angleBadge" class="badge" hidden>DEG</button>
      <div id="exprLine" class="expr-line"></div>
      <div id="big" class="big">0</div>
      <div id="msg" class="msg"></div>
    </section>
    <section id="keys" class="keys"></section>
  </main>
  <script src="calc-core.js"></script>
  <script src="app.js"></script>
</body>
</html>
